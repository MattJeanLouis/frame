<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonde d'encadrement</title>
<style>
  body { margin: 0; background: #0B0E14; color: #F2EEE6; font: 12px/1.4 system-ui, sans-serif; }
  .bloc { margin: 12px 0; padding: 0 12px; }
  .titre { color: #F2B544; margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .cadre { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #141925; overflow: hidden; border-radius: 4px; }
  .cadre--vertical { aspect-ratio: 9 / 16; }
  iframe { position: absolute; border: 0; }
  /* Traitement « couche par dessus » : l'iframe est neutralisée et agrandie,
     le voile et la pastille emoji vivent au-dessus. */
  .moment iframe { top: -50%; left: -50%; width: 200%; height: 200%; pointer-events: none; }
  .moment::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(125% 95% at 50% 42%, transparent 38%, rgba(11,14,20,.78)), linear-gradient(transparent 48%, #0B0E14);
  }
  .pastille { position: absolute; z-index: 2; left: 10px; bottom: 10px; display: flex; gap: 4px; }
  .pastille img { width: 26px; height: 26px; filter: drop-shadow(0 2px 6px #000); }
  .note { color: #A9B0BF; font-size: 10px; margin-top: 4px; }
</style>
</head>
<body>

<div class="bloc">
  <p class="titre">YouTube — brut</p>
  <div class="cadre"><iframe id="yt" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&loop=1&playlist=dQw4w9WgXcQ&modestbranding=1&rel=0&playsinline=1" style="inset:0;width:100%;height:100%"></iframe></div>
  <p class="note" id="note-yt">…</p>
</div>

<div class="bloc">
  <p class="titre">TikTok — brut (vertical)</p>
  <div class="cadre cadre--vertical"><iframe id="tt" src="https://www.tiktok.com/embed/v2/7634044930872134932" style="inset:0;width:100%;height:100%"></iframe></div>
  <p class="note" id="note-tt">…</p>
</div>

<div class="bloc">
  <p class="titre">TikTok — avec la couche par dessus</p>
  <div class="cadre cadre--vertical moment">
    <iframe id="tt2" src="https://www.tiktok.com/embed/v2/7634044930872134932" allow="autoplay; encrypted-media" tabindex="-1"></iframe>
    <span class="pastille">
      <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3ac.svg" alt="">
      <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f525.svg" alt="">
      <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f62e.svg" alt="">
    </span>
  </div>
  <p class="note">iframe neutralisée (pointer-events: none), agrandie, voile par-dessus</p>
</div>

<script>
  window.__probe = {};
  for (const id of ['yt', 'tt', 'tt2']) {
    const f = document.getElementById(id);
    f.addEventListener('load', () => { window.__probe[id] = 'load'; });
    f.addEventListener('error', () => { window.__probe[id] = 'error'; });
  }
</script>
</body>
</html>
