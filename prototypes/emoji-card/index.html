<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="FRAME — prototype de la carte-film en emoji.">
<title>FRAME — carte-film</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0E14'/%3E%3Crect x='7.5' y='7.5' width='17' height='17' rx='3' fill='none' stroke='%23F2B544' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="direction.css">
<link rel="stylesheet" href="catalogue.css">
<link rel="stylesheet" href="soiree.css">
<link rel="stylesheet" href="profil.css">
<link rel="stylesheet" href="liste.css">
<link rel="stylesheet" href="miroir.css">
<script src="../../config.local.js" onerror="window.FRAME_CONFIG = window.FRAME_CONFIG || {};"></script>
</head>
<body>

<div id="app">
  <!-- Le seul signe de marque : un cadre, pas un mot. -->
  <header id="bar">
    <a class="brand" href="./" aria-label="FRAME, accueil"><span class="brand__frame" aria-hidden="true"></span>FRAME<span class="brand__edition">CINÉMATHÈQUE PERSONNELLE</span></a>
    <div id="modes" role="tablist" aria-label="Présentation"></div>
    <button class="glyph" id="btn-profil" type="button" aria-label="Ton profil et la synchronisation">
      <span>Profil</span>
    </button>
    <button class="glyph" id="btn-soiree" type="button" aria-label="Soirée : choisir un film à plusieurs">
      <span>Soirée</span>
    </button>
    <button class="glyph" id="btn-liste" type="button" aria-label="Ma liste, organisée">
      <span>Ma liste</span>
    </button>
    <!-- Où tu en es dans le fil, en forme et non en chiffres. -->
    <span id="progress" aria-hidden="true"><i></i></span>
  </header>

  <!-- Chercher et filtrer : du texte, et des pictogrammes qui se lisent d'un coup. -->
  <div id="tools">
    <div class="tool-line"><div class="search">
      <span class="search__icon" aria-hidden="true"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             aria-label="Rechercher un film ou une série"
             placeholder="Un titre, ou « horreur fantômes »…">
      <div id="query-chips" class="query-chips"></div>
      <span class="search__tools">
        <button id="btn-emoji" class="glyph glyph--sm" type="button" aria-label="Chercher par emoji" aria-expanded="false"></button>
        <button id="search-clear" class="glyph glyph--sm" type="button" aria-label="Effacer la recherche" hidden></button>
      </span>
    </div>

    <button id="btn-refine" class="refine" type="button" aria-expanded="false" aria-controls="refinements">Filtres & tri <span id="filter-count"></span></button></div>

    <!-- Chaque rangée dit ce qu'elle est. Sans libellé, trois rangées de
         pastilles identiques se lisaient comme une seule bouillie. -->
    <div class="row" id="row-liste">
      <span class="row__label" aria-hidden="true">Ma liste</span>
      <div id="liste" role="group" aria-label="Ma liste"></div>
    </div>
    <aside id="refinements" aria-label="Affiner le catalogue" hidden>
      <div class="refinements-head"><div><span class="eyebrow">TA SÉLECTION</span><h2>Affiner.</h2></div><button type="button" id="close-refine" class="catalogue-control" aria-label="Fermer les filtres">✕</button></div>
      <div id="collection-filters"></div>
    <div class="row" id="row-filtres">
      <span class="row__label" aria-hidden="true">Genre</span>
      <div id="filters" role="group" aria-label="Filtres"></div>
    </div>
    <div class="row" id="row-sous-filtres" hidden>
      <label class="row__label" for="topic-search">Thèmes & sous-genres</label>
      <input id="topic-search" type="search" placeholder="Trouver un thème…" aria-label="Trouver un thème">
      <div id="sous-filtres" role="group" aria-label="Sous-catégories" hidden></div>
    </div>
    <div class="row" id="row-tris">
      <span class="row__label" aria-hidden="true">Trier</span>
      <div id="tris" role="group" aria-label="Ordre de présentation"></div>
    </div>

      <div class="discovery-fields">
        <label>Décennie<select id="filter-decade"><option value="">Toutes les époques</option><option value="2020">Années 2020</option><option value="2010">Années 2010</option><option value="2000">Années 2000</option><option value="1990">Années 1990</option><option value="1980">Années 1980</option><option value="1970">Années 1970</option><option value="1960">Années 1960</option><option value="1950">Années 1950</option><option value="1940">Années 1940</option><option value="1930">Années 1930</option><option value="1920">Années 1920</option></select></label>
        <label>Durée maximale<select id="filter-runtime"><option value="">Toutes les durées</option><option value="90">90 minutes</option><option value="120">2 heures</option><option value="150">2 h 30</option></select></label>
        <label>Langue originale<select id="filter-language"><option value="">Toutes les langues</option><option value="fr">Français</option><option value="en">Anglais</option><option value="ja">Japonais</option><option value="ko">Coréen</option><option value="es">Espagnol</option><option value="it">Italien</option><option value="de">Allemand</option><option value="hi">Hindi</option><option value="zh">Chinois</option></select></label>
        <label>Nombre de votes minimum<select id="filter-votes"><option value="0">Aucun — tout explorer</option><option value="50">50 votes</option><option value="100">100 votes</option><option value="1000">1 000 votes</option></select></label>
      </div>
      <div class="refinements-foot"><button type="button" id="reset-filters" class="catalogue-control">Tout effacer</button><button type="button" id="apply-filters" class="catalogue-control primary">Voir les résultats</button></div>
    </aside>

    <!-- Le moteur par emoji tombe de la barre : une seule recherche, deux écritures. -->
    <footer id="dock">
      <div id="drawers" role="tablist" aria-label="Familles de stickers"></div>
      <div id="palette" role="group" aria-label="Stickers"></div>
    </footer>
  </div>

  <div class="collection-heading">
    <div class="collection-context"><h1 id="collection-title">Le catalogue</h1><span id="collection-note"></span></div>
    <div class="catalogue-options"><button type="button" id="btn-collections" class="catalogue-control" aria-expanded="false" aria-controls="collections">Collections</button>
      <label class="density-control" for="catalogue-density">Affiches <select id="catalogue-density"><option value="comfortable">Grandes</option><option value="compact">Compactes</option></select></label>
      <button type="button" id="btn-immersive" class="catalogue-control" aria-pressed="false">Agrandir</button>
      <button type="button" id="btn-fullscreen" class="catalogue-control" aria-label="Activer le plein écran">⛶</button>
    </div>
  </div>
  <section id="collections" aria-label="Collections à explorer" hidden></section>
  <div id="active-filters" aria-label="Sélection active"></div>

  <!-- Le mur : les films, nommés par leur signature. Aucun titre visible. -->
  <main id="wall" aria-label="Films"></main>
  <div id="search-pagination" hidden><span id="search-status" role="status"></span><button id="load-next" class="catalogue-control" type="button">Charger la suite</button></div>


  <!-- Le texte inévitable : l'attribution, et rien d'autre. -->
  <p id="credit">
    Données et images de films fournies par
    <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
    Ce produit utilise l'API TMDB mais n'est ni approuvé ni certifié par TMDB.
    Emoji par <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a>, CC-BY 4.0.
  </p>
</div>

<!-- La carte-film en grand : le moment, ta signature, tes réactions, l'état. -->
<section id="card" hidden aria-label="Fiche du film"></section>

<!-- Le miroir : ce que tes gestes disent de tes goûts. -->
<section id="mirror" hidden aria-label="Ton miroir"></section>

<!-- La soirée : on choisit un film à plusieurs, chacun votant en privé. -->
<section id="soiree" hidden aria-label="Soirée"></section>

<!-- Le profil : qui tu es, et le code qui relie tes appareils. -->
<section id="profil" hidden aria-label="Profil"></section>

<!-- Ma liste, organisée — et la liste publique quand on ouvre un lien de partage. -->
<section id="liste-ecran" hidden aria-label="Ma liste"></section>

<button type="button" id="filter-backdrop" aria-label="Fermer les filtres" hidden></button>
<div id="status" role="status" class="sr-only"></div>

<script type="module" src="card.js"></script>
</body>
</html>
